<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:,">
<title>DoitDuck</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>
<header class="top">
  <b class="brand"><svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><circle cx="13" cy="12" r="7"/><path d="M19 11l7 2-7 2z"/><path d="M6 19c0 5 4 8 10 8s10-3 10-8c-3 2-6 2-10 2s-7-1-10-2z"/></svg><span>DoitDuck</span></b>
  <button id="lang" title="中文 / English"></button>
  <span id="conn" class="chip"><i class="dot"></i><span data-i18n="top.offline"></span></span>
  <span id="mode" class="chip"></span>
  <span id="owner" class="chip" hidden></span>
  <span id="battery" class="chip num" hidden></span>
  <button id="estop" class="danger" data-i18n="top.estop"></button>
</header>
<div id="banner" class="banner" hidden></div>
<nav id="nav" class="nav"></nav>
<main id="view"></main>
<div id="toast" class="toast"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
